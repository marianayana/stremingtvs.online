.bg-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.72);z-index:1;
  transition:background 0.6s ease;
}
.wrapper{
  position:relative;z-index:2;width:100%;
  max-width:460px;padding:24px 20px 48px;
  display:flex;flex-direction:column;align-items:center;
}

/* ===== LOGO ANIMATIONS ===== */
@keyframes entry{
  0%{transform:scale(0) rotate(-180deg);opacity:0;}
  60%{transform:scale(1.18) rotate(8deg);opacity:1;}
  80%{transform:scale(0.94) rotate(-4deg);}
  100%{transform:scale(1) rotate(0deg);opacity:1;}
}
@keyframes float{
  0%,100%{transform:translateY(0px) rotate(-1deg);}
  50%{transform:translateY(-12px) rotate(1deg);}
}
@keyframes bounce-click{
  0%{transform:scale(1) rotate(0deg);}
  20%{transform:scale(1.2) rotate(-8deg);}
  40%{transform:scale(0.9) rotate(6deg);}
  60%{transform:scale(1.12) rotate(-4deg);}
  80%{transform:scale(0.96) rotate(2deg);}
  100%{transform:scale(1) rotate(0deg);}
}
@keyframes ring-pulse{
  0%{transform:scale(1);opacity:0.7;}
  50%{transform:scale(1.18);opacity:0.2;}
  100%{transform:scale(1.35);opacity:0;}
}
@keyframes orbit{
  from{transform:rotate(0deg) translateX(74px) rotate(0deg);}
  to{transform:rotate(360deg) translateX(74px) rotate(-360deg);}
}
@keyframes orbit2{
  from{transform:rotate(180deg) translateX(60px) rotate(-180deg);}
  to{transform:rotate(540deg) translateX(60px) rotate(-540deg);}
}
@keyframes sparkle-pop{
  0%,100%{transform:scale(0);opacity:0;}
  40%,60%{transform:scale(1);opacity:1;}
}

/* ===== TITLE ANIMATIONS ===== */
@keyframes title-entry{
  0%{opacity:0;transform:translateY(20px) scaleX(0.7);letter-spacing:12px;}
  60%{opacity:1;transform:translateY(-3px) scaleX(1.02);letter-spacing:5px;}
  100%{transform:translateY(0) scaleX(1);letter-spacing:3px;}
}
@keyframes letter-wave{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-6px);}
}
@keyframes color-shift{
  0%,100%{color:#e50914;}
  25%{color:#ff6b35;}
  50%{color:#ffd700;}
  75%{color:#ff1493;}
}
@keyframes subtitle-slide{
  0%{opacity:0;transform:translateX(-30px);}
  100%{opacity:1;transform:translateX(0);}
}
@keyframes glow-pulse{
  0%,100%{text-shadow:0 0 8px rgba(229,9,20,0.4),0 2px 12px rgba(0,0,0,0.9);}
  50%{text-shadow:0 0 20px rgba(255,100,50,0.8),0 0 40px rgba(229,9,20,0.4),0 2px 12px rgba(0,0,0,0.9);}
}

.logo-section{
  display:flex;flex-direction:column;align-items:center;
  margin-bottom:16px;
}

.logo-orbit-wrap{
  position:relative;
  width:148px;height:148px;
  display:flex;align-items:center;justify-content:center;
}

/* Pulsing rings behind logo */
.ring{
  position:absolute;top:50%;left:50%;
  width:130px;height:130px;
  margin:-65px 0 0 -65px;
  border-radius:50%;
  border:2px solid var(--accent);
  animation:ring-pulse 2s ease-out infinite;
  transition:border-color 0.5s;
}
.ring:nth-child(2){animation-delay:0.7s;}
.ring:nth-child(3){animation-delay:1.4s;}

/* Orbit dots */
.orbit-dot{
  position:absolute;top:50%;left:50%;
  width:9px;height:9px;border-radius:50%;
  background:var(--accent);
  margin:-4.5px 0 0 -4.5px;
  animation:orbit 3.5s linear infinite;
  transition:background 0.5s;
  box-shadow:0 0 6px currentColor;
}
.orbit-dot.d2{
  width:6px;height:6px;margin:-3px 0 0 -3px;
  animation:orbit2 5s linear infinite;
  opacity:0.6;
}

/* Sparkle dots */
.sp{
  position:absolute;top:50%;left:50%;
  width:7px;height:7px;border-radius:50%;
  background:#ffd700;
  animation:sparkle-pop 2.4s ease-in-out infinite;
}
.sp:nth-child(5){margin:-70px 0 0 20px;animation-delay:0s;}
.sp:nth-child(6){margin:-40px 0 0 70px;animation-delay:0.6s;background:#ff69b4;}
.sp:nth-child(7){margin:30px 0 0 65px;animation-delay:1.2s;background:#00cfff;}
.sp:nth-child(8){margin:60px 0 0 -20px;animation-delay:1.8s;background:#ffd700;}

.logo-img{
  width:128px;height:128px;object-fit:contain;
  border-radius:50%;
  animation:entry 1s cubic-bezier(0.34,1.56,0.64,1) forwards,
             float 3.2s ease-in-out 1.1s infinite;
  cursor:pointer;
  position:relative;z-index:2;
  transition:filter 0.5s;
}
.logo-img.bouncing{
  animation:bounce-click 0.6s ease forwards!important;
}

/* Title */
.title-wrap{
  margin-top:8px;text-align:center;
  animation:title-entry 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.4s both;
}
.title-main{
  font-size:26px;font-weight:900;
  letter-spacing:3px;text-transform:uppercase;
  color:#fff;
  animation:glow-pulse 3s ease-in-out 1.2s infinite;
  display:inline-block;
}
.title-tvs{
  display:inline-block;
  animation:color-shift 4s ease-in-out 1.5s infinite;
  font-style:italic;
}

/* Each letter waves */
.wave-letter{
  display:inline-block;
}
.wave-letter:nth-child(1){animation:letter-wave 2s ease-in-out 0s infinite;}
.wave-letter:nth-child(2){animation:letter-wave 2s ease-in-out 0.15s infinite;}
.wave-letter:nth-child(3){animation:letter-wave 2s ease-in-out 0.3s infinite;}
.wave-letter:nth-child(4){animation:letter-wave 2s ease-in-out 0.45s infinite;}
.wave-letter:nth-child(5){animation:letter-wave 2s ease-in-out 0.6s infinite;}
.wave-letter:nth-child(6){animation:letter-wave 2s ease-in-out 0.75s infinite;}
.wave-letter:nth-child(7){animation:letter-wave 2s ease-in-out 0.9s infinite;}
.wave-letter:nth-child(8){animation:letter-wave 2s ease-in-out 1.05s infinite;}
.wave-letter:nth-child(9){animation:letter-wave 2s ease-in-out 1.2s infinite;}

.tagline{
  font-size:11px;color:rgba(255,255,255,0.5);
  letter-spacing:3px;text-transform:uppercase;
  margin-bottom:20px;
  animation:subtitle-slide 0.6s ease 1s both;
}

/* Platform logo */
.plat-logo-wrap{
  width:100%;display:flex;justify-content:center;align-items:center;
  margin-bottom:16px;min-height:84px;
  background:rgba(0,0,0,0.55);border-radius:16px;
  border:1px solid rgba(255,255,255,0.15);
  padding:12px 32px;backdrop-filter:blur(8px);
  transition:border-color 0.5s;overflow:hidden;
}
.plat-logo-wrap img{max-height:64px;max-width:280px;object-fit:contain;filter:drop-shadow(0 2px 8px rgba(0,0,0,0.6));}

/* Card */
.card{
  width:100%;border-radius:20px;padding:26px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  transition:border-color 0.5s,background 0.5s;
  background:rgba(10,10,20,0.82);border:1px solid rgba(255,255,255,0.12);
}
.field-label{font-size:10px;text-transform:uppercase;letter-spacing:2px;color:rgba(255,255,255,0.45);margin-bottom:7px;}
.field-wrap{margin-bottom:18px;}
input[type=email],select{
  width:100%;padding:13px 16px;background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.15);border-radius:12px;
  color:#fff;font-size:14px;outline:none;appearance:none;-webkit-appearance:none;
  transition:border-color 0.3s;
}
input[type=email]::placeholder{color:rgba(255,255,255,0.25);}
input[type=email]:focus,select:focus{border-color:var(--accent);background:rgba(255,255,255,0.12);}
select option{background:#1a1a2e;color:#fff;}
.select-wrap{position:relative;}
.select-wrap::after{content:"▾";position:absolute;right:14px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,0.4);pointer-events:none;}
.btn{
  width:100%;padding:15px;background:var(--accent);
  border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:700;
  cursor:pointer;letter-spacing:0.5px;text-transform:uppercase;
  transition:opacity 0.2s,transform 0.1s,background 0.5s;margin-top:4px;
}
.btn:hover{opacity:0.85;}
.btn:active{transform:scale(0.98);}
.btn:disabled{opacity:0.6;cursor:not-allowed;}
.divider{border:none;border-top:1px solid rgba(255,255,255,0.1);margin:22px 0;}
.code-area{background:rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:22px;text-align:center;}
.code-label{font-size:10px;text-transform:uppercase;letter-spacing:3px;color:rgba(255,255,255,0.4);margin-bottom:12px;}
.code-value{font-size:44px;font-weight:700;letter-spacing:10px;color:var(--code-color);font-family:'Courier New',monospace;}
.code-placeholder{font-size:28px;color:rgba(255,255,255,0.1);letter-spacing:8px;font-family:'Courier New',monospace;}
.code-sub{font-size:11px;color:rgba(255,255,255,0.35);margin-top:10px;}
@keyframes spin{to{transform:rotate(360deg);}}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,0.2);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:middle;margin-right:8px;}
body.mubi-mode .card{background:rgba(245,240,232,0.92);}
body.mubi-mode .field-label{color:#777;}
body.mubi-mode input[type=email],body.mubi-mode select{background:rgba(0,0,0,0.06);border-color:rgba(0,0,0,0.15);color:#111;}
body.mubi-mode input[type=email]::placeholder{color:rgba(0,0,0,0.3);}
body.mubi-mode .btn{color:#fff;}
body.mubi-mode .code-placeholder{color:rgba(0,0,0,0.12);}
body.mubi-mode .code-value{color:#1a1a1a;}
body.mubi-mode .select-wrap::after{color:#777;}
</style>

function bounceLogo() {
  const img = document.getElementById('siteLogoImg');
  img.classList.add('bouncing');
  setTimeout(() => {
    img.classList.remove('bouncing');
    img.style.animation = 'float 3.2s ease-in-out infinite';
  }, 620);
}

function updatePlatform() {
  const val = document.getElementById('plat').value;
  const p = PLATFORMS[val];
  document.documentElement.style.setProperty('--accent', p.accent);
  document.documentElement.style.setProperty('--border', p.border);
  document.documentElement.style.setProperty('--code-color', val==='mubi'?'#1a1a1a':'#7bf5a0');
  document.getElementById('bgOverlay').style.background = p.overlay;
  document.getElementById('mainCard').style.background = p.bgCard;
  document.getElementById('mainCard').style.borderColor = p.border+'44';
  document.getElementById('platLogoWrap').style.borderColor = p.border+'88';
  document.getElementById('platLogoImg').src = LOGOS[val]||'';
  document.body.classList.toggle('mubi-mode', val==='mubi');
}

async function consultar() {
  const email = document.getElementById('email').value.trim();
  const plat = document.getElementById('plat').value;
  const codeVal = document.getElementById('codeVal');
  const codePlaceholder = document.getElementById('codePlaceholder');
  const codeSub = document.getElementById('codeSub');
  const btn = document.getElementById('mainBtn');
  if(!email){codeSub.textContent='Por favor ingresa tu correo.';return;}
  btn.innerHTML='<span class="spinner"></span>Buscando...';
  btn.disabled=true;
  codeVal.style.display='none';
  codePlaceholder.style.display='block';
  codePlaceholder.textContent='· · · ·';
  codeSub.textContent='Conectando con tu correo...';
  try{
    const r=await fetch(`${SCRIPT_URL}?email=${encodeURIComponent(email)}&plataforma=${plat}`);
    const data=await r.json();
    if(data.codigo){
      codeVal.textContent=data.codigo;
      codeVal.style.display='block';
      codePlaceholder.style.display='none';
      codeSub.textContent='Codigo listo. Usalo antes de que expire.';
    }else{
      codePlaceholder.textContent='— — — —';
      codeSub.textContent='No se encontro codigo reciente. Intenta de nuevo.';
    }
  }catch(e){
    codePlaceholder.textContent='— — — —';
    codeSub.textContent='Error de conexion. Revisa tu internet.';
  }
  btn.innerHTML='Obtener codigo de acceso';
  btn.disabled=false;
}

updatePlatform();
</script>
</body>
</html>
